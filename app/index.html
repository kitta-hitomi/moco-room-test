<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>mocoのお部屋</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
  <script src="./weather.js" defer></script>
  <script src="./captions.js" defer></script>
</head>
<body>
  <main class="room">
    <h1>mocoのお部屋</h1>
    <div class="room-visual">
      <div class="room-frame" id="room-frame" aria-busy="true">
        <p class="room-message" id="room-message" role="status">お部屋を準備しています…</p>
      </div>
      <div id="effects" class="effects" aria-hidden="true"></div>
    </div>
    <p id="caption" class="caption" aria-live="polite"></p>
    <div class="controls" aria-label="お部屋の表示">
      <div class="reactions" id="reactions" aria-label="mocoへのアクション">
        <button type="button" data-reaction="pet" disabled>なでなで</button>
        <button type="button" data-reaction="snack" disabled>おやつ</button>
        <button type="button" data-reaction="call" disabled>よびかけ</button>
      </div>
      <button id="next-scene" type="button" disabled>別の様子を見る</button>
      <fieldset id="preview" disabled>
        <legend>時間帯をプレビュー</legend>
        <button type="button" data-band="morning" aria-pressed="false">朝</button>
        <button type="button" data-band="day" aria-pressed="false">昼</button>
        <button type="button" data-band="evening" aria-pressed="false">夕方</button>
        <button type="button" data-band="night" aria-pressed="false">夜</button>
        <button type="button" data-band="now" aria-pressed="true">今の時間</button>
      </fieldset>
      <details class="weather-settings">
        <summary>天気の地域</summary>
        <p id="weather-status" role="status">天気を確認しています…</p>
        <form id="location-search">
          <label for="location-query">市区町村名</label>
          <div class="search-row"><input id="location-query" required autocomplete="off" placeholder="市区町村名を入力"><button type="submit">検索</button></div>
        </form>
        <p id="location-message" role="status"></p>
        <ul id="location-results"></ul>
        <div class="location-actions"><button id="use-location" type="button">現在地を使う</button><button id="reset-location" type="button">設定をリセット</button></div>
      </details>
    </div>
  </main>
</body>
</html>
